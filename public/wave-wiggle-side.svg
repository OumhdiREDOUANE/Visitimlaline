<!--
  The owner's tile, turned a quarter on. The left and right bands need the wave
  on its side, and CSS cannot turn a mask image without turning the element that
  carries it — and an element that is turned has to know how long it is. So the
  turn lives here, where the drawing can be carried over from wave-wiggle.svg
  unchanged.

  The path below is byte-for-byte the path in that file; only the viewBox and a
  rotate(90) are added. `rotate(90)` maps the tile's up to right, so the solid
  half ends up on the side that faces the card and the crests reach out of it,
  which is what the top and bottom bands already do. The right band mirrors
  this host with `scaleX(-1)`, so both sides face the card the same way.

  Measured against the same drawing rendered across the top: the crests land at
  the card's edge, the ink runs the full depth of the band in both, and the
  period is the same 55.8px. tests/wave-line.test.js compares the two `d` values,
  so this cannot become a second drawing.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="-15 0 15 29.9"><g transform="rotate(90)"><path fill="#fff" d="M22.1,10C22,10,22,10,22.1,10c-1.8,0-3.6-1.3-5.4-3.9C13.8,1.9,10.6-.1,7.1,0C4,.1,1.6,1.9,0,3.5V15h2.1h5.1h5.3H22h.1h7.8V3.5c-1.2,1.2-2,2.3-2.2,2.6C27,7.2,24.6,10,22.1,10z"/></g></svg>
